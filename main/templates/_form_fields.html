{% if form.non_field_errors %}
  <div class="alert alert-error">
    {% for e in form.non_field_errors %}{{ e }}<br>{% endfor %}
  </div>
{% endif %}
{% for field in form %}
  <div class="field{% if field.errors %} has-error{% endif %}{% if field.field.widget.input_type == 'checkbox' %} field-check{% endif %}">
    {% if field.field.widget.input_type == 'checkbox' %}
      <label>{{ field }} {{ field.label }}</label>
    {% else %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
    {% endif %}
    {% for error in field.errors %}<div class="error-text">{{ error }}</div>{% endfor %}
  </div>
{% endfor %}
