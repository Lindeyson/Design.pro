{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="form-box">
  <h1>Регистрация</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include '_form_fields.html' %}
    <button class="btn" type="submit">Зарегистрироваться</button>
  </form>
  <p class="muted">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
</div>
{% endblock %}
